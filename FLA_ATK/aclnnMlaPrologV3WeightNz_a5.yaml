# aclnnMlaPrologV3WeightNz ATK metadata for A5 (ascend950)
# Doc: A5 supports all quant scenes. This script covers modes backed by
# function_mla_prolog_v3.py golden (wq=0/1/2/3/4/5). CPU 真值对齐
# aclnnMlaPrologV3WeightNz（无 doRope 属性，RoPE 始终生效）。
# 16 legal A5 (wq,kvq,qq) scenes from the doc:
#   (0,0,0) non-quant
#   (1,0,0)/(1,2,0)/(1,3,0) partial quant
#   (2,0,0)/(2,1,1)/(2,3,0) int8 full
#   (3,0,0)/(3,1,1)/(3,3,0) mxfp8 full
#   (4,0,0)/(4,1,1)/(4,3,0) fp8 full (FP8E4M3 + FLOAT scales)
#   (5,0,0)/(5,1,1)/(5,3,0) hif8 full
# qq=1 only with kvq=1 and wq in {2,3,4,5}
# cacheMode (doc 6 values; generator binds matching token/kv/kr/index/actualSeqLen):
#   PA_BSND / PA_NZ: token (T,He), kv (BlockNum,BlockSize,Nkv,H), cacheIndex (T)
#   PA_BLK_BSND / PA_BLK_NZ: 合轴 token (T,He) + actualSeqLen prefix (B) + page-id index
#   BSND: token (B,S,He), kv (B,S,Nkv,H), cacheIndex=null
#   TND: token (T,He), kv (T,Nkv,H), cacheIndex=null
#   kvq=3 pertoken-pergroup: 仅 PA_BSND/BSND/TND，Dtile=656，krCache=(0)
# tokenX / weightDq / weightUqQr / weightDkvKr dtypes: BF16, INT8, FP8E4M3, UINT8(HiFloat8 存储)
api: pytorch
api_type: function_mla_prolog_v3
aclnn_api_type: pyaclnn_function_mla_prolog_v3
version: v2.1
name: aclnn.MlaPrologV3WeightNz
aclnn_name: MlaPrologV3WeightNz
generate: ascend_generate_aclnn_mla_prolog_v3_a5
dtype_numbers: 100
extra_numbers: 0
backward: false
standard:
  # 与 A5 已验证 all_mla_prolog_v4.json 对齐；需配合 node: pyaclnn + npu
  acc:
    cv_fused_double_benchmark:
      max_re_ratio: 2
      avg_re_ratio: 1.2
      root_mean_squared_ratio: 1.2
inputs:
  # 0 tokenX  合轴 (T, He)；BSND 非合轴 (B, S, He)
  - name: token_x
    type: tensor
    required: true
    dtypes:
      values: [bf16, int8, fp8e4m3, uint8]
    ranges:
      valid:
        values: [[-2, 2]]
      invalid:
        values: [[-2, 2]]
    shapes:
      dim_numbers:
        values: [2, 3]
      dim_values:
        values: [[1, 100], [1, 100], [1, 100]]

  # 1 weightDq  FRACTAL_NZ (He, Hcq)
  - name: weight_dq
    type: tensor
    required: true
    dtypes:
      values: [bf16, int8, fp8e4m3, uint8]
    ranges:
      valid:
        values: [[-2, 2]]
      invalid:
        values: [[-2, 2]]
    shapes:
      dim_numbers:
        values: [2]
      dim_values:
        values: [[1, 100], [1, 100]]

  # 2 weightUqQr  FRACTAL_NZ (Hcq, N*(D+Dr))
  - name: weight_uq_qr
    type: tensor
    required: true
    dtypes:
      values: [bf16, int8, fp8e4m3, uint8]
    ranges:
      valid:
        values: [[-2, 2]]
      invalid:
        values: [[-2, 2]]
    shapes:
      dim_numbers:
        values: [2]
      dim_values:
        values: [[1, 100], [1, 100]]

  # 3 weightUk  ND (N, D, Hckv)
  - name: weight_uk
    type: tensor
    required: true
    dtypes:
      values: [bf16]
    ranges:
      valid:
        values: [[-2, 2]]
      invalid:
        values: [[-2, 2]]
    shapes:
      dim_numbers:
        values: [3]
      dim_values:
        values: [[1, 100], [1, 100], [1, 100]]

  # 4 weightDkvKr  FRACTAL_NZ (He, Hckv+Dr)
  - name: weight_dkv_kr
    type: tensor
    required: true
    dtypes:
      values: [bf16, int8, fp8e4m3, uint8]
    ranges:
      valid:
        values: [[-2, 2]]
      invalid:
        values: [[-2, 2]]
    shapes:
      dim_numbers:
        values: [2]
      dim_values:
        values: [[1, 100], [1, 100]]

  # 5 rmsnormGammaCq
  - name: rmsnorm_gamma_cq
    type: tensor
    required: true
    dtypes:
      values: [bf16]
    ranges:
      valid:
        values: [[-1, 1]]
      invalid:
        values: [[-1, 1]]
    shapes:
      dim_numbers:
        values: [1]
      dim_values:
        values: [[1, 100]]

  # 6 rmsnormGammaCkv
  - name: rmsnorm_gamma_ckv
    type: tensor
    required: true
    dtypes:
      values: [bf16]
    ranges:
      valid:
        values: [[-1, 1]]
      invalid:
        values: [[-1, 1]]
    shapes:
      dim_numbers:
        values: [1]
      dim_values:
        values: [[1, 100]]

  # 7 ropeSin  合轴 (T, Dr)；BSND (B, S, Dr)
  - name: rope_sin
    type: tensor
    required: true
    dtypes:
      values: [bf16]
    ranges:
      valid:
        values: [[-1, 1]]
      invalid:
        values: [[-1, 1]]
    shapes:
      dim_numbers:
        values: [2, 3]
      dim_values:
        values: [[1, 100], [1, 100], [1, 100]]

  # 8 ropeCos  合轴 (T, Dr)；BSND (B, S, Dr)
  - name: rope_cos
    type: tensor
    required: true
    dtypes:
      values: [bf16]
    ranges:
      valid:
        values: [[-1, 1]]
      invalid:
        values: [[-1, 1]]
    shapes:
      dim_numbers:
        values: [2, 3]
      dim_values:
        values: [[1, 100], [1, 100], [1, 100]]

  # 9 kvCacheRef
  #   PA_*: (BlockNum, BlockSize, Nkv, Hckv)
  #   BSND: (B, S, Nkv, Hckv)
  #   TND:  (T, Nkv, Hckv)
  - name: kv_cache
    type: tensor
    required: true
    dtypes:
      values: [bf16, int8, fp8e4m3, uint8]
    ranges:
      valid:
        values: [0]
      invalid:
        values: [0]
    shapes:
      dim_numbers:
        values: [3, 4]
      dim_values:
        values: [[1, 100], [1, 100], [1, 100], [1, 100]]

  # 10 krCacheRef  同 kvCache 布局，最后一维为 Dr；ckvkrRepoMode=1 时 shape (0)
  - name: kr_cache
    type: tensor
    required: true
    dtypes:
      values: [bf16, int8]
    ranges:
      valid:
        values: [0]
      invalid:
        values: [0]
    shapes:
      dim_numbers:
        values: [1, 3, 4]
      dim_values:
        values: [[0, 100], [1, 100], [1, 100], [1, 100]]

  # 11 cacheIndexOptional
  #   PA_BSND/PA_NZ: (T), range [0, BlockNum*BlockSize)
  #   PA_BLK_*: (sum ceil(Si/BlockSize)), range [0, BlockNum)
  #   BSND/TND: nullptr
  - name: cache_index
    type: tensor
    required: false
    dtypes:
      values: [int64]
    ranges:
      valid:
        values: [[0, 100]]
      invalid:
        values: [[0, 100]]
    shapes:
      dim_numbers:
        values: [1]
      dim_values:
        values: [[1, 100]]

  # 12 dequantScaleXOptional
  # wq=2: fp32 (T,1); wq=3: uint8 placeholder (T, He/32) rewritten to e8m0 in plugin
  - name: dequant_scale_x
    type: tensor
    required: false
    dtypes:
      values: [fp32, uint8]
    ranges:
      valid:
        values: [[0.001, 0.01]]
      invalid:
        values: [[0.001, 0.01]]
    shapes:
      dim_numbers:
        values: [2]
      dim_values:
        values: [[1, 100], [1, 100]]

  # 13 dequantScaleWDqOptional
  - name: dequant_scale_w_dq
    type: tensor
    required: false
    dtypes:
      values: [fp32, uint8]
    ranges:
      valid:
        values: [[0.001, 0.01]]
      invalid:
        values: [[0.001, 0.01]]
    shapes:
      dim_numbers:
        values: [2]
      dim_values:
        values: [[1, 100], [1, 100]]

  # 14 dequantScaleWUqQrOptional
  - name: dequant_scale_w_uq_qr
    type: tensor
    required: false
    dtypes:
      values: [fp32, uint8]
    ranges:
      valid:
        values: [[0.001, 0.01]]
      invalid:
        values: [[0.001, 0.01]]
    shapes:
      dim_numbers:
        values: [2]
      dim_values:
        values: [[1, 100], [1, 100]]

  # 15 dequantScaleWDkvKrOptional
  - name: dequant_scale_w_dkv_kr
    type: tensor
    required: false
    dtypes:
      values: [fp32, uint8]
    ranges:
      valid:
        values: [[0.001, 0.01]]
      invalid:
        values: [[0.001, 0.01]]
    shapes:
      dim_numbers:
        values: [2]
      dim_values:
        values: [[1, 100], [1, 100]]

  # 16 quantScaleCkvOptional  kvq=1:(1); kvq=2:(1,Hckv)
  - name: quant_scale_ckv
    type: tensor
    required: false
    dtypes:
      values: [fp32]
    ranges:
      valid:
        values: [[0.001, 0.01]]
      invalid:
        values: [[0.001, 0.01]]
    shapes:
      dim_numbers:
        values: [1, 2]
      dim_values:
        values: [[1, 100], [1, 100]]

  # 17 quantScaleCkrOptional
  - name: quant_scale_ckr
    type: tensor
    required: false
    dtypes:
      values: [fp32]
    ranges:
      valid:
        values: [[0.001, 0.01]]
      invalid:
        values: [[0.001, 0.01]]
    shapes:
      dim_numbers:
        values: [2]
      dim_values:
        values: [[1, 100], [1, 100]]

  # 18 smoothScalesCqOptional
  - name: smooth_scales_cq
    type: tensor
    required: false
    dtypes:
      values: [fp32]
    ranges:
      valid:
        values: [[0.001, 0.01]]
      invalid:
        values: [[0.001, 0.01]]
    shapes:
      dim_numbers:
        values: [2]
      dim_values:
        values: [[1, 100], [1, 100]]

  # 19 actualSeqLenOptional  仅 PA_BLK_* 合轴：前缀和 (B)，末值=T
  - name: actual_seq_len
    type: tensor
    required: false
    dtypes:
      values: [int32]
    ranges:
      valid:
        values: [[1, 128]]
      invalid:
        values: [[1, 128]]
    shapes:
      dim_numbers:
        values: [1]
      dim_values:
        values: [[1, 100]]

  # 20 kNopeClipAlphaOptional  仅 wq=1/2 且 kvq=3(pertile)；其余场景由 generator 置 null
  - name: k_nope_clip_alpha
    type: tensor
    required: false
    dtypes:
      values: [fp32]
    ranges:
      valid:
        values: [[0.5, 2.0]]
      invalid:
        values: [[0.5, 2.0]]
    shapes:
      dim_numbers:
        values: [1]
      dim_values:
        values: [[1, 1]]

  # 21 rmsnormEpsilonCq
  - name: rmsnormEpsilonCq
    type: attr
    required: true
    dtypes:
      values: [double]
    ranges:
      valid:
        values: [0.00001]
      invalid:
        values: [0.00001]

  # 22 rmsnormEpsilonCkv
  - name: rmsnormEpsilonCkv
    type: attr
    required: true
    dtypes:
      values: [double]
    ranges:
      valid:
        values: [0.00001]
      invalid:
        values: [0.00001]

  # 23 cacheModeOptional  文档 6 种：PA_BSND / PA_NZ / PA_BLK_BSND / PA_BLK_NZ / BSND / TND
  - name: cacheMode
    type: attr
    required: true
    dtypes:
      values: [string]
    ranges:
      valid:
        values: ["PA_BSND", "PA_NZ", "PA_BLK_BSND", "PA_BLK_NZ", "BSND", "TND"]
      invalid:
        values: ["PA_BSND", "PA_NZ", "PA_BLK_BSND", "PA_BLK_NZ", "BSND", "TND"]

  # 24 weightQuantMode  A5: 0/1/2/3 (mxfp8)/4 (fp8 full)/5 (hif8)
  - name: weightQuantMode
    type: attr
    required: true
    dtypes:
      values: [int64_t]
    ranges:
      valid:
        values: [0, 1, 2, 3, 4, 5]
      invalid:
        values: [0, 1, 2, 3, 4, 5]

  # 25 kvCacheQuantMode  0非量化 / 1 pertensor / 2 perchannel / 3 pertoken-pergroup
  - name: kvCacheQuantMode
    type: attr
    required: true
    dtypes:
      values: [int64_t]
    ranges:
      valid:
        values: [0, 1, 2, 3]
      invalid:
        values: [0, 1, 2, 3]

  # 26 queryQuantMode
  - name: queryQuantMode
    type: attr
    required: true
    dtypes:
      values: [int64_t]
    ranges:
      valid:
        values: [0, 1]
      invalid:
        values: [0, 1]

  # 27 ckvkrRepoMode  kvq=3 必须为 1（kr 合入 kvCache，krCache shape 含 0）
  - name: ckvkrRepoMode
    type: attr
    required: true
    dtypes:
      values: [int64_t]
    ranges:
      valid:
        values: [0, 1]
      invalid:
        values: [0, 1]

  # 28 quantScaleRepoMode  kvq=3 必须为 1（scale 合入 kvCache）
  - name: quantScaleRepoMode
    type: attr
    required: true
    dtypes:
      values: [int64_t]
    ranges:
      valid:
        values: [0, 1]
      invalid:
        values: [0, 1]

  # 29 tileSize
  - name: tileSize
    type: attr
    required: true
    dtypes:
      values: [int64_t]
    ranges:
      valid:
        values: [128]
      invalid:
        values: [128]

  # 30 qcQrScale
  - name: qcQrScale
    type: attr
    required: true
    dtypes:
      values: [double]
    ranges:
      valid:
        values: [1.0]
      invalid:
        values: [1.0]

  # 31 kcScale
  - name: kcScale
    type: attr
    required: true
    dtypes:
      values: [double]
    ranges:
      valid:
        values: [1.0]
      invalid:
        values: [1.0]
