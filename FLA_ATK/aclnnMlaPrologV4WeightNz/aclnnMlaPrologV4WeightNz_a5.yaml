# A5 / Ascend 950: document-driven legal case generalization.
# Source: aclnnMlaPrologV4WeightNz.md (downloaded interface reference).
# MLA_V4_PROFILE=golden (default): wq 0..3; full: wq 0..5 (16 scenes).
# Full profile requires fp8/hif8 golden + plugin support; hif8 is the dtype alias.
# Generator binds correlated shapes/dtypes/attrs; do not sample attrs independently.
# Logical weights must be converted to FRACTAL_NZ by the existing adapter.
# uint8 MX scale placeholders must be converted to e8m0 by the existing adapter.
api: pytorch
api_type: function_mla_prolog_v4
aclnn_api_type: pyaclnn_function_mla_prolog_v4
version: v2.1
name: aclnn.MlaPrologV4WeightNz
aclnn_name: MlaPrologV4WeightNz
generate: ascend_generate_aclnn_mla_prolog_v4_a5
dtype_numbers: 500
extra_numbers: 0
backward: false
standard:
  # 与 A5 已验证 all_mla_prolog_v4.json 对齐；需配合 node: pyaclnn + npu
  acc:
    cv_fused_double_benchmark:
      max_re_ratio: 2
      avg_re_ratio: 1.2
      root_mean_squared_ratio: 1.2
inputs:
  # 0 tokenX: (T, He) or (B, S, He)
  # Generator preserves valid shapes and repairs out-of-range dimensions. Default: (B, S, 7168).
  # For (T, He), use dim_numbers [2] and dim_values [[0, 256], [7168, 7168]].
  - name: token_x
    type: tensor
    required: true
    dtypes:
      values: [bf16, int8, fp8e4m3, hif8]
    ranges:
      valid:
        values: [[-2, 2]]
      invalid:
        values: [[-2, 2]]
    shapes:
      dim_numbers:
        values: [3]
      dim_values:
        values: [[0, 4], [0, 256], [7168, 7168]]

  # 1 weightDq  FRACTAL_NZ (He, Hcq)
  - name: weight_dq
    type: tensor
    required: true
    dtypes:
      values: [bf16, int8, fp8e4m3, hif8]
    ranges:
      valid:
        values: [[-2, 2]]
      invalid:
        values: [[-2, 2]]
    shapes:
      dim_numbers:
        values: [2]
      dim_values:
        values: [[1, 100], [1, 100]]

  # 2 weightUqQr  FRACTAL_NZ (Hcq, N*(D+Dr))
  - name: weight_uq_qr
    type: tensor
    required: true
    dtypes:
