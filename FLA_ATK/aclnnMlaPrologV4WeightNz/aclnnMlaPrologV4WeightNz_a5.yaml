    ranges:
      valid:
        values: [[-2, 2]]
      invalid:
        values: [[-2, 2]]
    shapes:
      dim_numbers:
        values: [3]
      dim_values:
        values: [[1, 100], [1, 100], [1, 100]]

  # 4 weightDkvKr  FRACTAL_NZ (He, Hckv+Dr)
