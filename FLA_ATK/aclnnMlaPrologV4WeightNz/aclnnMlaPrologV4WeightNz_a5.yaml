# aclnnMlaPrologv4WeightNz ATK metadata for A5 (ascend950)
# Doc: A5 supports all quant scenes. This script covers modes backed by
# function_mla_prolog_v4.py golden (wq=0/1/2/3). wq=4/5 (fp8/hif8) not generated
# until golden support is added.
# Scenes:
#   - wq=0 kvq=0: non-quant
#   - wq=1 kvq=0: partial quant, kvCache non-quant
#   - wq=1 kvq=2: partial quant, kvCache per-channel
#   - wq=2 kvq=0: int8 full quant, kvCache non-quant
#   - wq=3 kvq=1 qq=1: mxfp8 full quant + kv per-tensor + query quant
api: pytorch
api_type: function_mla_prolog_v4
aclnn_api_type: pyaclnn_function_mla_prolog_v4
version: v2.1
name: aclnn.MlaPrologV4WeightNz
aclnn_name: MlaPrologV4WeightNz
generate: ascend_generate_aclnn_mla_prolog_v4_a5
dtype_numbers: 100
extra_numbers: 0
backward: false
standard:
  # 与 A5 已验证 all_mla_prolog_v4.json 对齐；需配合 node: pyaclnn + npu
  acc:
    cv_fused_double_benchmark:
      max_re_ratio: 2
      avg_re_ratio: 1.2
      root_mean_squared_ratio: 1.2
inputs:
  # 0 tokenX  BS合轴 (T, He)
  - name: token_x
    type: tensor
    required: true
    dtypes:
      values: [bf16, int8, fp8e4m3]
    ranges:
      valid:
        values: [[-2, 2]]
      invalid:
        values: [[-2, 2]]
    shapes:
      dim_numbers:
        values: [2]
      dim_values:
        values: [[1, 100], [1, 100]]

  # 1 weightDq  FRACTAL_NZ (He, Hcq)
  - name: weight_dq
    type: tensor
    required: true
    dtypes:
      values: [bf16, int8, fp8e4m3]
    ranges:
      valid:
        values: [[-2, 2]]
      invalid:
        values: [[-2, 2]]
    shapes:
      dim_numbers:
        values: [2]
      dim_values:
        values: [[1, 100], [1, 100]]

  # 2 weightUqQr  FRACTAL_NZ (Hcq, N*(D+Dr))
  - name: weight_uq_qr
    type: tensor
    required: true
    dtypes:
      values: [bf16, int8, fp8e4m3]
    ranges:
